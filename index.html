<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFF1F3">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="정상회담">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>정상회담</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#FFF1F3; --dot:#FFDCE2; --surface:#FFFFFF; --surface2:#FFE4E9; --ink:#4B2E38; --ink2:#7D5866; --line:#F6C9D1;
  --accent:#D0344E; --accent-ink:#FFFFFF;
  --neta:#FF8A6B; --rice:#FFFFFF; --blush:#FF9DB0;
  --good:#23785A; --good-bg:#D7F3E5; --sun:#7A5300; --sun-bg:#FFE7A0;
  --av-ink:#FFFFFF;
  --m0:#3B6FB0; --m1:#B8641B; --m2:#2F8060; --m3:#8E4FA0; --m4:#2C7F8A; --m5:#C2455E;
  --display:'Jua','Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --sans:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#2B1E24; --dot:#35262D; --surface:#3A2932; --surface2:#4A3540; --ink:#FFE9EE; --ink2:#D8B4BF; --line:#5C444F;
    --accent:#FF7C93; --accent-ink:#2B0F17;
    --neta:#FF9C7E; --rice:#F5EAEC; --blush:#FF8CA3;
    --good:#8EE0B8; --good-bg:#24463A; --sun:#FFE7A0; --sun-bg:#5A4410;
    --av-ink:#2B1E24;
    --m0:#7DB2E8; --m1:#EAA867; --m2:#86D0A9; --m3:#C797D6; --m4:#78CBD6; --m5:#F09AAC;
  }
}
:root[data-theme="dark"]{
  --bg:#2B1E24; --dot:#35262D; --surface:#3A2932; --surface2:#4A3540; --ink:#FFE9EE; --ink2:#D8B4BF; --line:#5C444F;
  --accent:#FF7C93; --accent-ink:#2B0F17;
  --neta:#FF9C7E; --rice:#F5EAEC; --blush:#FF8CA3;
  --good:#8EE0B8; --good-bg:#24463A; --sun:#FFE7A0; --sun-bg:#5A4410;
  --av-ink:#2B1E24;
  --m0:#7DB2E8; --m1:#EAA867; --m2:#86D0A9; --m3:#C797D6; --m4:#78CBD6; --m5:#F09AAC;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg);font-synthesis:none;-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;min-height:100dvh;background-color:var(--bg);background-image:radial-gradient(var(--dot) 2px,transparent 2.5px);background-size:24px 24px;color:var(--ink);font:400 16px/1.6 var(--sans);word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit}
b{font-weight:400;font-family:var(--display)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{max-width:560px;margin:0 auto;padding:0 18px 72px}

/* mascot */
.mascot{display:block;flex:none;height:auto}
.mk-rice{fill:var(--rice);stroke:var(--line);stroke-width:2.5}
.mk-neta{fill:var(--neta)}
.mk-fat{fill:none;stroke:#fff;stroke-opacity:.55;stroke-width:2.6;stroke-linecap:round}
.mk-eye{fill:#4B2E38}
.mk-blush{fill:var(--blush);opacity:.75}
.mk-mouth{fill:none;stroke:#4B2E38;stroke-width:2.4;stroke-linecap:round}
@media (prefers-reduced-motion:no-preference){
  .top .mascot{transform-origin:50% 90%;animation:wig 1.1s ease-in-out .5s 2}
  @keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
}

/* header */
.top{display:flex;align-items:center;gap:12px;padding:22px 0 12px}
.ttl{flex:1;min-width:0}
h1{margin:0;font:400 34px/1.1 var(--display);color:var(--accent)}
.sub{margin:6px 0 0;font-size:13.5px;line-height:1.45;color:var(--ink2)}
.stack{flex:none;display:flex;padding-left:6px;align-self:flex-start;margin-top:8px}
.stack .av{margin-left:-6px;box-shadow:0 0 0 2px var(--bg);width:26px;height:26px;font-size:12px}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;background:var(--bg);margin:0 -18px;padding:8px 18px 10px}
.tab{flex:1;min-width:0;min-height:44px;padding:8px 2px;border:2px solid var(--line);border-radius:99px;background:var(--surface);color:var(--ink2);font:400 16px/1.3 var(--display);cursor:pointer}
.tab[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* notes */
.note{margin:12px 0 0;padding:12px 16px;border-radius:20px;background:var(--surface);border:2px dashed var(--line);font-size:14px;color:var(--ink2)}
.note.act{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--ink)}
.note.warn{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* next meeting */
.next{display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin:12px 0 6px;padding:16px;border:0;border-radius:30px;background:var(--accent);color:var(--accent-ink);cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.16)}
.next:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.16)}
.next.empty{background:var(--surface);border:2.5px dashed var(--line);color:var(--ink2);cursor:default;box-shadow:none}
.next.empty:active{transform:none}
.dd{flex:none;display:grid;place-items:center;width:74px;height:74px;border-radius:50%;background:var(--surface);color:var(--accent);font:400 25px/1 var(--display);text-align:center}
.nx{display:block;min-width:0}
.nx-l{display:inline-block;padding:1px 11px;border-radius:99px;background:color-mix(in srgb,var(--accent-ink) 22%,transparent);font-size:12.5px}
.next.empty .nx-l{background:var(--surface2)}
.nx-n{display:block;margin-top:3px;font:400 23px/1.3 var(--display)}
.nx-w{display:block;font-size:14px;opacity:.95}

/* section head */
.sec{display:flex;align-items:center;justify-content:space-between;margin:26px 0 4px}
h2{margin:0;font:400 22px/1.3 var(--display)}
.yr{margin:16px 0 0;font:400 16px var(--display);color:var(--ink2)}

/* meeting rows */
.row{display:grid;grid-template-columns:58px 1fr auto;gap:12px;width:100%;margin:10px 0 0;padding:14px;border:2px solid var(--line);border-radius:26px;background:var(--surface);text-align:left;cursor:pointer}
.row:active{transform:scale(.99)}
.dt{align-self:start;padding:6px 0 8px;border-radius:18px;background:var(--surface2);text-align:center;transform:rotate(-3deg)}
.row:nth-of-type(even) .dt{transform:rotate(3deg)}
.mo{display:block;font-size:12.5px;color:var(--ink2)}
.dy{display:block;font:400 27px/1.1 var(--display)}
.rn{display:block;font:400 20px/1.35 var(--display)}
.ra{display:block;font-size:13.5px;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:14px}
.chip.dim{color:var(--ink2);opacity:.65}
.sc{text-align:right}
.sc .n{display:block;font:400 27px/1.1 var(--display);color:var(--accent)}
.tag{display:inline-block;padding:3px 13px;border-radius:99px;background:var(--good-bg);color:var(--good);font:400 14px var(--display)}
.empty-msg{padding:28px 0;text-align:center;color:var(--ink2)}
.empty-msg .mascot{margin:0 auto 10px}
.empty-msg p{margin:0}

/* avatar */
.av{display:inline-grid;place-items:center;width:21px;height:21px;border-radius:50%;background:var(--c);color:var(--av-ink);font:400 12px/1 var(--display);flex:none}
.av.lg{width:38px;height:38px;font-size:17px}

/* nigiri rating */
.pcs{display:inline-flex;gap:2px;vertical-align:middle}
.pc{position:relative;display:inline-block;width:var(--pw,18px);aspect-ratio:32/20}
.pc-on{position:absolute;inset:0}
.nig{display:block;width:100%;height:100%}
.nig .rice,.nig .neta{stroke-width:.9}
.nig.off .rice{fill:var(--surface2);stroke:var(--line)}
.nig.off .neta{fill:var(--bg);stroke:var(--line)}
.nig.on .rice{fill:var(--rice);stroke:var(--line)}
.nig.on .neta{fill:var(--neta);stroke:var(--neta)}
.sc .pcs{--pw:17px}

/* detail */
.back{margin:14px 0 0;padding:8px 16px;border:2px solid var(--line);border-radius:99px;background:var(--surface);color:var(--ink2);font:400 15px/1.3 var(--display);cursor:pointer}
.d-date{margin:14px 0 0;font-size:14px;color:var(--ink2)}
.d-name{margin:0;font:400 31px/1.25 var(--display)}
.d-meta{display:flex;flex-wrap:wrap;gap:2px 16px;margin-top:6px;font-size:15px;color:var(--ink2)}
.d-memo{margin:12px 0 0;padding:12px 14px;border-radius:20px;background:var(--surface);border:2px dashed var(--line);font-size:15px;white-space:pre-wrap}
.sum{margin:18px 0 12px;padding:18px;border-radius:28px;background:var(--surface);border:2px solid var(--line)}
.sum-top{display:flex;align-items:center;gap:16px}
.big{font:400 54px/1 var(--display);color:var(--accent)}
.sum-top .pcs{--pw:26px}
.sum-cnt{font-size:14px;color:var(--ink2);margin-top:2px}
.drow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.drow small{color:var(--ink2);margin-left:4px}
.drow .v{display:inline-flex;align-items:center;gap:8px;font:400 17px var(--display);min-width:96px;justify-content:flex-end}
.drow .pcs{--pw:18px}
.sum .drow{border-top:2px dotted var(--line);margin-top:2px}
.rv{margin:0 0 12px;padding:14px;border-radius:26px;background:var(--surface);border:2px solid var(--line)}
.rv-h{display:flex;align-items:center;gap:10px}
.rv-h .nm{font:400 18px var(--display);flex:1;min-width:0}
.rv-s{display:flex;align-items:center;gap:8px;margin-top:8px}
.rv-s b{font:400 24px var(--display);color:var(--accent)}
.rv-s .pcs{--pw:22px}
.rv-d{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:14px;color:var(--ink2)}
.rv-best{margin-top:8px;font-size:15px}
.rv-best b{color:var(--accent)}
.rv p{margin:6px 0 0;font-size:16px;white-space:pre-wrap}
.rv.none{background:transparent;border-style:dashed;color:var(--ink2);font-size:15px}

/* rank + members */
.rank{list-style:none;margin:8px 0 0;padding:0}
.rank li{margin-top:10px}
.rkrow{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;width:100%;padding:14px;border:2px solid var(--line);border-radius:26px;background:var(--surface);text-align:left;cursor:pointer}
.rkrow:active{transform:scale(.99)}
.visit{margin-top:22px}
.visit-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-bottom:8px}
.visit-d{font-size:14px;color:var(--ink2)}
.visit-h>.btn{margin-left:auto}
.cats{display:flex;flex-wrap:wrap;gap:0 12px}
.memmain{display:flex;align-items:center;gap:12px;flex:1;min-width:0;padding:0;border:0;background:none;text-align:left;cursor:pointer}
.mhead{display:flex;align-items:center;gap:12px;margin-top:14px}
.mhead .d-name{margin:0}
.rk{font:400 28px/1 var(--display);color:var(--ink2);text-align:center}
.rank li:first-child .rkrow{background:var(--surface2)}
.rank li:first-child .rk{color:var(--accent)}
.mem{display:flex;align-items:center;gap:12px;margin-top:10px;padding:14px;border:2px solid var(--line);border-radius:26px;background:var(--surface)}
.mem .grow{flex:1;min-width:0}
.mem .nm{font:400 19px var(--display)}
.mem .st{font-size:14px;color:var(--ink2)}
.mem .sc .n{font-size:22px}

/* buttons */
.btn{min-height:46px;padding:10px 20px;border-radius:99px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:400 16px/1.2 var(--display);cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 4px 0 rgba(0,0,0,.16)}
.btn.pri:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.16)}
.btn.warn{color:var(--accent);border-color:var(--accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding:6px 10px;min-height:36px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.55;cursor:default}

/* sheet */
.backdrop{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(43,20,30,.5)}
.sheet{width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--surface);border-radius:32px 32px 0 0;padding:14px 18px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet::before{content:"";display:block;width:46px;height:5px;margin:0 auto 14px;border-radius:99px;background:var(--line)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(28px)}to{transform:none}}}
.sheet h3{margin:0;font:400 24px/1.3 var(--display)}
.hint{margin:4px 0 0;font-size:14px;color:var(--ink2)}
.sheet label,.lab{display:block;margin:16px 0 6px;font:400 16px/1.4 var(--display)}
.sheet input,.sheet textarea{width:100%;font:inherit;font-size:16px;padding:11px 14px;border:2px solid var(--line);border-radius:18px;background:var(--bg);color:var(--ink)}
.sheet textarea{resize:vertical;min-height:84px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{min-height:20px;margin-top:10px;font-size:14px;color:var(--accent)}
.actions{display:flex;gap:8px;margin-top:8px}
.actions .btn{flex:1}
.actions .btn.pri{flex:2}
.rate{display:flex;gap:4px}
.rate.big .pc{--pw:46px}
.rp{position:relative;display:inline-block;padding:4px 1px}
.rh{position:absolute;top:0;bottom:0;width:50%;padding:0;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.rh.l{left:0}
.rh.r{right:0}
.rh:focus-visible{outline-offset:-2px}
.rate-wrap{display:flex;align-items:center;gap:8px}
.rout{min-width:30px;text-align:right;font:400 17px var(--display);color:var(--accent)}
.rate:not(.big) .pc{--pw:32px}
.who{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.who button{display:inline-flex;align-items:center;gap:6px;padding:6px 14px 6px 8px;border-radius:99px;border:2px solid var(--line);background:none;cursor:pointer;font-size:15px}
.who button[aria-pressed="true"]{border-color:var(--accent);background:var(--surface2);font-family:var(--display)}
.who.multi button[aria-pressed="false"]{opacity:.5}

.att{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:12px;font-size:15px}
.att-n{font-family:var(--display)}
.lnks{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.lnks a{display:inline-flex;align-items:center;min-height:42px;padding:8px 16px;border-radius:99px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:400 16px var(--display);text-decoration:none}
.phs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ph{width:92px;height:92px;padding:0;border:0;border-radius:20px;overflow:hidden;background:var(--surface2);cursor:pointer}
.ph img{display:block;width:100%;height:100%;object-fit:cover}
.pgrid{display:flex;flex-wrap:wrap;gap:8px}
.pth{position:relative;width:84px;height:84px;border-radius:20px;overflow:hidden;background:var(--surface2)}
.pth img{display:block;width:100%;height:100%;object-fit:cover}
.pth button{position:absolute;top:3px;right:3px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.62);color:#fff;font-size:16px;line-height:1;cursor:pointer}
.padd{width:84px;height:84px;border-radius:20px;border:2px dashed var(--line);background:none;color:var(--ink2);font-size:14px;cursor:pointer}
.pstat{margin-top:6px;font-size:14px;color:var(--ink2);min-height:20px}
.lb{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.92);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.lb .lb-set{top:auto;right:auto;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:auto;height:auto;padding:12px 22px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font:400 16px var(--display)}
.cv{grid-column:1/-1;display:block;height:150px;margin:-4px -4px 4px;border-radius:20px;overflow:hidden;background:var(--surface2)}
.cv img{display:block;width:100%;height:100%;object-fit:cover}
.cover{display:block;width:100%;height:200px;margin-top:12px;padding:0;border:0;border-radius:26px;overflow:hidden;background:var(--surface2);cursor:zoom-in}
.cover img{display:block;width:100%;height:100%;object-fit:cover}
.lb button{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:22px;cursor:pointer}

.no{display:block;font:400 14px/1.3 var(--display);color:var(--accent)}
.no-pill{display:inline-block;margin-right:8px;padding:1px 11px;border-radius:99px;background:var(--surface2);color:var(--accent);font:400 14px var(--display)}
.mapbox{position:relative;height:300px;margin-top:12px;border-radius:28px;overflow:hidden;border:2px solid var(--line);background:var(--surface2)}
.maphost{position:absolute;inset:0}
.mapcanvas{position:absolute;inset:0}
.mapmsg{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;color:var(--ink2);font-size:14px}
.mapmsg p{margin:0}
.pin{display:grid;place-items:center;min-width:34px;height:34px;padding:0 9px;border-radius:99px;border:3px solid #fff;font:400 16px/1 var(--display);box-shadow:0 3px 0 rgba(0,0,0,.25);cursor:pointer}
.pin.done{background:var(--accent);color:var(--accent-ink)}
.pin.todo{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.fchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.fchip{min-height:40px;padding:6px 16px;border-radius:99px;border:2px solid var(--line);background:var(--surface);color:var(--ink2);font:400 15px var(--display);cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pl{display:block;width:100%;margin-top:10px;padding:14px;border:2px solid var(--line);border-radius:26px;background:var(--surface);text-align:left;cursor:pointer}
.pl-h{display:block;margin-bottom:6px}
.pl-m{display:block;margin-top:4px;font-size:14px;color:var(--ink2)}
.tag.acc{background:var(--surface2);color:var(--accent)}
.tag.sun{background:var(--sun-bg);color:var(--sun)}
.tag.no{background:var(--surface2);color:var(--ink2)}
.pl-h .tag+.tag{margin-left:6px}
.pin.sun{background:var(--sun-bg);color:var(--sun);border-color:#E0A800}
.searchbox{display:block;width:100%;margin-top:12px;padding:12px 18px;border:2px solid var(--line);border-radius:99px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
.qbox{margin-top:12px;padding:12px 16px;border-radius:22px;background:var(--surface);border:2px dashed var(--line)}
.qbox p{margin:0}
.qbox .btn{margin-top:10px}
.mapnote{margin:10px 0 0;font-size:13.5px;color:var(--ink2)}
.sbar{display:flex;gap:8px}
.sbar input{flex:1;min-width:0}
.sbar .btn{flex:none;padding:10px 16px}
.sr{display:block;width:100%;margin-top:8px;padding:10px 14px;border:2px solid var(--line);border-radius:18px;background:var(--bg);text-align:left;cursor:pointer}
.sr-n{display:block;font:400 17px/1.3 var(--display)}
.sr-a{display:block;font-size:13.5px;color:var(--ink2)}
.sr-c{display:inline-block;margin-top:2px;padding:0 9px;border-radius:99px;background:var(--surface2);font-size:12.5px;color:var(--ink2)}
.dexsum{display:flex;align-items:center;gap:14px;margin-top:14px;padding:14px 18px;border-radius:26px;background:var(--surface);border:2px solid var(--line)}
.dexsum p{margin:0}
.dexsum b{color:var(--accent);font-size:21px}
.podium{display:flex;align-items:flex-end;gap:8px;margin-top:8px}
.pod{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px 10px;border:2px solid var(--line);border-radius:26px;background:var(--surface);text-align:center;cursor:pointer}
.pod.p1{flex:1.3;padding-top:18px;background:var(--surface2);border-color:var(--accent)}
.pod-r{font:400 14px var(--display);color:var(--accent)}
.pod-n{font:400 17px/1.25 var(--display)}
.pod-c{font-size:13px;color:var(--ink2)}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.dcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:26px 8px 12px;border:2px solid var(--line);border-radius:26px;background:var(--surface);text-align:center;cursor:pointer}
.dcard:active,.pod:active{transform:scale(.98)}
.dn{font:400 19px/1.25 var(--display)}
.dcnt{position:absolute;top:10px;right:10px;padding:0 10px;border-radius:99px;background:var(--surface2);color:var(--accent);font:400 14px var(--display)}
.dnew{position:absolute;top:10px;left:10px;padding:0 10px;border-radius:99px;background:var(--good-bg);color:var(--good);font:400 12.5px var(--display)}
.dwho{display:flex;justify-content:center;margin-top:2px}
.dwho .av{margin-left:-5px;box-shadow:0 0 0 2px var(--surface)}
.dwho .av:first-child{margin-left:0}
.favs{margin-top:8px;padding:4px 16px;border-radius:26px;background:var(--surface);border:2px solid var(--line)}
.fav{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:2px dotted var(--line)}
.fav:last-child{border-bottom:0}
.fav-n{min-width:52px;font:400 17px var(--display)}
.fav-v{flex:1;min-width:0}
.fav-v b{color:var(--accent);font-size:18px}
.dexhero{display:flex;justify-content:center;padding:6px 0 2px}
.dimg{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:18px;background:var(--surface2)}
.dcard .dimg{width:92px;height:92px;aspect-ratio:auto;border-radius:22px}
.pod .pimg{display:block;width:100%;max-width:70px;aspect-ratio:1/1;object-fit:cover;border-radius:18px;background:var(--surface2)}
.pod.p1 .pimg{max-width:86px}
.dexhero .dimg{width:120px;border-radius:24px}
.dexbtns{display:flex;justify-content:center;gap:8px;margin:10px 0 2px}
.dexstat{margin:6px 0 0;text-align:center;font-size:13.5px;color:var(--ink2);min-height:20px}
.pk{display:flex;align-items:center;gap:10px;width:100%;margin-top:8px;padding:10px 14px;border:2px solid var(--line);border-radius:20px;background:var(--bg);text-align:left;cursor:pointer}
.pk-n{display:block;font:400 17px var(--display)}
.pk-m{display:block;font-size:13.5px;color:var(--ink2)}
.inst{margin-top:26px;padding:16px 18px;border-radius:26px;background:var(--surface);border:2px dashed var(--line)}
.inst h3{margin:0 0 4px;font:400 19px var(--display)}
.inst p{margin:6px 0 0;font-size:14.5px}
.inst ol{margin:8px 0 0;padding-left:20px;font-size:14.5px}
.inst .btn{margin-top:10px}
.gate{max-width:420px;margin:0 auto;padding:44px 0 24px;text-align:center}
.gate .mascot{margin:0 auto 10px}
.gate h1{font-size:40px}
.gate .sub{margin:6px 0 20px}
.gform{padding:18px;border-radius:28px;background:var(--surface);border:2px solid var(--line);text-align:left}
.gform label{display:block;margin:12px 0 6px;font:400 16px/1.4 var(--display)}
.gform input{width:100%;font:inherit;font-size:16px;padding:11px 14px;border:2px solid var(--line);border-radius:18px;background:var(--bg);color:var(--ink)}
.gform .btn{margin-top:14px}
.gform .btn.ghost{margin-top:6px}
.err.ok{color:var(--good)}
.acct{margin-top:28px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;max-width:calc(100% - 36px);padding:10px 18px;border-radius:99px;background:var(--ink);color:var(--bg);font:400 16px var(--display);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.skel{padding:60px 0;text-align:center;color:var(--ink2)}
.skel .mascot{margin:0 auto 10px}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheetRoot"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="lightbox"></div>

<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const clone = o => JSON.parse(JSON.stringify(o));
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const fmt = n => n == null ? '–' : n.toFixed(1);
const DOW = ['일','월','화','수','목','금','토'];
const pad = n => String(n).padStart(2, '0');
function todayStr(){ const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function pd(s){ const p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function daysUntil(s){ return Math.round((pd(s) - pd(todayStr())) / 86400000); }
function longDate(s){ const d = pd(s); return d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + DOW[d.getDay()] + '요일'; }
function shortDate(s){ const d = pd(s); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + DOW[d.getDay()] + ')'; }
const byDateDesc = (a, b) => String(b.date || '').localeCompare(String(a.date || '')) || (b.createdAt || 0) - (a.createdAt || 0);
const won = n => Number(n).toLocaleString('ko-KR') + '원';
const initial = name => Array.from(String(name).trim())[0] || '?';

/* ---------- state ---------- */
const S = {
  ready: false, mode: 'loading', meId: null, profileName: '',
  canMeet: true, canReview: true, error: '',
  meetings: [], members: {}, photos: {}, tab: 'log', detail: null, gate: 'loading', user: null, gateMsg: '', wishes: [], dexImgs: {}, mapFilter: 'all', mapQuery: '', store: null, memberView: null
};

/* ---------- storage backends ---------- */
const Store = {
  saveMeeting: async () => {}, deleteMeeting: async () => {}, updateMember: async () => {}, savePhotos: async () => {}, saveWish: async () => {}, deleteWish: async () => {}, saveDex: async () => {}, deleteDex: async () => {}
};

const safeImg = u => typeof u === 'string' && u.length < 150000 && /^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(u);
const safeUrl = u => (typeof u === 'string' && /^https?:\/\//i.test(u)) ? u : '';
function normUrl(v){
  v = String(v || '').trim(); if (!v) return '';
  const hit = v.match(/https?:\/\/[^\s]+/i);
  if (hit) v = hit[0]; else if (/\s/.test(v)) return null; else v = 'https://' + v;
  try { const u = new URL(v); if (!/^https?:$/.test(u.protocol) || u.hostname.indexOf('.') < 0) return null; return u.href; }
  catch (e) { return null; }
}
function normInsta(v){
  v = String(v || '').trim(); if (!v) return '';
  if (!/instagram\.com/i.test(v) && /^@?[A-Za-z0-9._]{1,30}$/.test(v)) return 'https://www.instagram.com/' + v.replace(/^@/, '') + '/';
  return normUrl(v);
}
function instaShown(u){
  const m = String(u || '').match(/^https:\/\/www\.instagram\.com\/([A-Za-z0-9._]+)\/?$/);
  return m ? '@' + m[1] : (u || '');
}
function setPhotos(mid, id, arr){ (S.photos[mid] || (S.photos[mid] = {}))[id] = arr; }

/* ---------- Firebase (공유 저장소 + 로그인) ---------- */
const cfgOk = () => typeof FIREBASE_CONFIG !== 'undefined' && !!FIREBASE_CONFIG && [FIREBASE_CONFIG.apiKey, FIREBASE_CONFIG.projectId].every(v => v && String(v).indexOf('여기') < 0);
let auth = null, fs = null, listeners = [];
const PhotoSubs = {};
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout' }), ms))]);

const dexId = key => 'dex_' + Array.from(new TextEncoder().encode(String(key))).map(b => b.toString(16).padStart(2, '0')).join('');
function stopListeners(){
  listeners.forEach(u => { try { u(); } catch (e) {} });
  listeners = [];
  Object.keys(PhotoSubs).forEach(k => { try { PhotoSubs[k](); } catch (e) {} delete PhotoSubs[k]; });
}
function resetData(){
  S.meetings = []; S.wishes = []; S.dexImgs = {}; S.members = {}; S.photos = {}; S.ready = false; S.detail = null; S.store = null; S.memberView = null; S.tab = 'log'; S.error = '';
}
function startListeners(){
  let gotM = false, gotR = false;
  const check = () => { if (gotM && gotR) S.ready = true; };
  const onErr = e => { S.error = '데이터를 불러오지 못했어요 (' + (e && e.code ? e.code : 'error') + '). 새로고침해 주세요.'; S.ready = true; render(true); };
  listeners.push(fs.collection('meetings').onSnapshot(snap => {
    const all = snap.docs.map(d => Object.assign({}, d.data(), { id: d.id }));
    S.meetings = all.filter(x => x.kind !== 'wish' && x.kind !== 'dex');
    S.wishes = all.filter(x => x.kind === 'wish');
    const dm = {};
    all.filter(x => x.kind === 'dex').forEach(x => { if (x.key && safeImg(x.img)) dm[x.key] = x.img; });
    S.dexImgs = dm;
    gotM = true; check(); render(true);
  }, onErr));
  listeners.push(fs.collection('reviews').onSnapshot(snap => {
    const m = {};
    snap.docs.forEach(d => { m[d.id] = d.data(); });
    S.members = m;
    gotR = true; check(); render(true);
  }, onErr));
}

async function enter(user){
  S.user = user; S.meId = user.uid; S.gate = 'checking'; render(false);
  let member = false, failed = null;
  try { const d = await fs.collection('members').doc(user.uid).get(); member = d.exists; }
  catch (e) { console.error(e); failed = e; }
  if (!auth.currentUser || auth.currentUser.uid !== user.uid) return;
  if (failed) { S.gate = 'error'; S.gateMsg = '서버에 연결하지 못했어요 (' + (failed.code || 'error') + '). 인터넷 연결과 설정 가이드의 3·4단계(로그인 방법, 데이터베이스, 규칙)를 확인해 주세요.'; render(false); return; }
  if (!member) { S.gate = 'join'; render(false); return; }
  S.gate = 'ready'; render(false); startListeners();
}

async function initCloud(){
  if (!cfgOk()) return false;
  S.mode = 'db'; S.canMeet = true; S.canReview = true;
  if (typeof firebase === 'undefined') {
    S.gate = 'error'; S.gateMsg = '서버 연결 도구를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.';
    render(false); return true;
  }
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    auth = firebase.auth(); fs = firebase.firestore();
    try { fs.settings({ ignoreUndefinedProperties: true, experimentalAutoDetectLongPolling: true }); } catch (e) {}
  } catch (e) {
    console.error(e);
    S.gate = 'error'; S.gateMsg = 'Firebase 설정을 확인해 주세요. (' + (e && e.code ? e.code : 'init') + ')'; render(false); return true;
  }
  S.gate = 'loading'; render(false);

  Store.saveMeeting = async m => {
    const body = clone(m); delete body.id;
    await withTimeout(fs.collection('meetings').doc(m.id).set(body), 15000);
  };
  Store.deleteMeeting = async id => { await withTimeout(fs.collection('meetings').doc(id).delete(), 15000); };
  Store.saveWish = Store.saveMeeting;
  Store.deleteWish = Store.deleteMeeting;
  Store.saveDex = async (key, img) => { await withTimeout(fs.collection('meetings').doc(dexId(key)).set({ kind: 'dex', key: key, img: img, updatedAt: Date.now() }), 15000); };
  Store.deleteDex = async key => { await withTimeout(fs.collection('meetings').doc(dexId(key)).delete(), 15000); };
  let queue = Promise.resolve();
  Store.updateMember = (memberId, fn) => {
    const run = queue.then(async () => {
      const cur = S.members[memberId] ? clone(S.members[memberId]) : null;
      const next = fn(cur);
      await withTimeout(fs.collection('reviews').doc(memberId).set(clone(next)), 15000);
    });
    queue = run.catch(() => {});
    return run;
  };
  Store.savePhotos = async (memberId, mid, imgs) => {
    const ref = fs.collection('photos').doc(memberId).collection('m').doc(mid);
    if (!imgs.length) await withTimeout(ref.delete(), 15000);
    else await withTimeout(ref.set({ imgs: imgs, updatedAt: Date.now() }), 15000);
  };

  auth.onAuthStateChanged(user => {
    stopListeners(); resetData();
    if (!user) { S.user = null; S.meId = null; S.gate = 'out'; render(false); return; }
    enter(user);
  });
  return true;
}

function syncPhotos(){
  if (S.mode !== 'db' || !fs || S.gate !== 'ready') return;
  const want = {};
  if (S.detail) memberList().forEach(mem => { want[S.detail + '|' + mem.id] = [S.detail, mem.id]; });
  Object.keys(PhotoSubs).forEach(k => { if (!want[k]) { PhotoSubs[k](); delete PhotoSubs[k]; } });
  Object.keys(want).forEach(k => {
    if (PhotoSubs[k]) return;
    const mid = want[k][0], id = want[k][1];
    PhotoSubs[k] = fs.collection('photos').doc(id).collection('m').doc(mid).onSnapshot(snap => {
      const d = snap.exists ? snap.data() : null;
      setPhotos(mid, id, d && Array.isArray(d.imgs) ? d.imgs.filter(safeImg) : []);
      render(true);
    }, () => {});
  });
}

/* ---------- 로그인 / 참여 화면 ---------- */
function authMsg(e){
  const c = (e && e.code) || '';
  if (c === 'auth/invalid-email') return '이메일 형식을 확인해 주세요.';
  if (c === 'auth/email-already-in-use') return '이미 가입된 이메일이에요. 로그인해 주세요.';
  if (c === 'auth/weak-password') return '비밀번호는 6자 이상이어야 해요.';
  if (['auth/user-not-found', 'auth/wrong-password', 'auth/invalid-credential', 'auth/invalid-login-credentials'].indexOf(c) >= 0) return '이메일이나 비밀번호가 맞지 않아요.';
  if (c === 'auth/too-many-requests') return '시도가 너무 많았어요. 잠시 뒤에 다시 해 주세요.';
  if (c === 'auth/network-request-failed') return '인터넷 연결을 확인해 주세요.';
  if (c === 'auth/operation-not-allowed') return '이메일/비밀번호 로그인이 아직 켜지지 않았어요. 설정 가이드 3단계를 확인해 주세요.';
  return '문제가 생겼어요. (' + (c || 'error') + ')';
}
function renderGate(){
  const g = S.gate;
  const head = t => '<div class="gate">' + mascot(96) + '<h1>정상회담</h1><p class="sub">' + t + '</p>';
  let h;
  if (g === 'out') {
    h = head('모임 멤버만 들어올 수 있어요') +
      '<div class="gform"><label for="g-email">이메일</label><input id="g-email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false">' +
      '<label for="g-pw">비밀번호</label><input id="g-pw" type="password" autocomplete="current-password">' +
      '<div class="err" id="g-err" role="alert"></div>' +
      '<button class="btn pri wide" data-act="gLogin">로그인</button>' +
      '<button class="btn wide" data-act="gSignup" style="margin-top:12px">처음이에요 (가입하기)</button>' +
      '<button class="btn ghost wide" data-act="gReset">비밀번호를 잊었어요</button></div></div>';
  } else if (g === 'join') {
    h = head('로그인 완료! 모임에 참여해 주세요') +
      '<div class="gform"><label for="g-code">초대 코드</label><input id="g-code" autocomplete="off" autocapitalize="off" spellcheck="false">' +
      '<label for="g-nick">모임에서 쓸 이름</label><input id="g-nick" maxlength="12" placeholder="예: 민수" autocomplete="off">' +
      '<div class="err" id="g-err" role="alert"></div>' +
      '<button class="btn pri wide" data-act="gJoin">참여하기</button>' +
      '<button class="btn ghost wide" data-act="gLogout">다른 계정으로 로그인</button></div></div>';
  } else if (g === 'error') {
    h = head('연결에 문제가 있어요') + '<div class="gform"><p style="margin:0 0 6px">' + esc(S.gateMsg) + '</p>' +
      (auth ? '<button class="btn pri wide" data-act="gRetry">다시 시도</button><button class="btn ghost wide" data-act="gLogout">로그아웃</button>' : '') + '</div></div>';
  } else {
    h = head('불러오는 중…') + '</div>';
  }
  app.innerHTML = h;
  window.scrollTo(0, 0);
}
async function gateBusy(btn, fn){
  const err = $('#g-err');
  if (btn) btn.disabled = true;
  if (err) { err.className = 'err'; err.textContent = ''; }
  try { await fn(err); } catch (e) { console.error(e); if (err) err.textContent = authMsg(e); }
  if (btn && btn.isConnected) btn.disabled = false;
}
function readCred(err){
  const email = $('#g-email').value.trim(), pw = $('#g-pw').value;
  if (!email || !pw) { err.textContent = '이메일과 비밀번호를 입력해 주세요.'; return null; }
  return { email: email, pw: pw };
}
const gateActions = {
  gLogin: btn => gateBusy(btn, async err => { const c = readCred(err); if (c) await auth.signInWithEmailAndPassword(c.email, c.pw); }),
  gSignup: btn => gateBusy(btn, async err => {
    const c = readCred(err); if (!c) return;
    if (c.pw.length < 6) { err.textContent = '비밀번호는 6자 이상으로 정해 주세요.'; return; }
    await auth.createUserWithEmailAndPassword(c.email, c.pw);
  }),
  gReset: btn => gateBusy(btn, async err => {
    const email = $('#g-email').value.trim();
    if (!email) { err.textContent = '위 칸에 이메일을 먼저 입력해 주세요.'; return; }
    await auth.sendPasswordResetEmail(email);
    err.className = 'err ok'; err.textContent = '재설정 메일을 보냈어요. 스팸함도 확인해 주세요.';
  }),
  gJoin: btn => gateBusy(btn, async err => {
    const code = $('#g-code').value.trim(), nick = $('#g-nick').value.trim();
    if (!code) { err.textContent = '초대 코드를 입력해 주세요.'; return; }
    if (!nick) { err.textContent = '이름을 입력해 주세요.'; return; }
    try { await withTimeout(fs.collection('members').doc(S.meId).set({ code: code, joinedAt: Date.now() }), 15000); }
    catch (e) { err.textContent = (e && e.code === 'permission-denied') ? '초대 코드가 맞지 않아요.' : saveError(e); return; }
    try { await withTimeout(fs.collection('reviews').doc(S.meId).set({ nickname: nick, entries: {}, createdAt: Date.now() }), 15000); }
    catch (e) { console.error(e); }
    S.gate = 'ready'; render(false); startListeners();
  }),
  gLogout: () => { if (auth) auth.signOut(); },
  gRetry: () => { if (auth && auth.currentUser) enter(auth.currentUser); }
};

function initLocal(){
  S.mode = 'local'; S.meId = null; S.canMeet = true; S.canReview = true;
  const KEY = 'sushi-log-v1';
  try {
    const j = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (j) {
      S.meetings = j.meetings || []; S.members = j.members || {}; S.wishes = j.wishes || [];
      Object.keys(j.dexImgs || {}).forEach(k => { if (safeImg(j.dexImgs[k])) S.dexImgs[k] = j.dexImgs[k]; });
    }
  } catch (e) {}
  const PKEY = 'sushi-photos-v1';
  try {
    const pj = JSON.parse(localStorage.getItem(PKEY) || 'null');
    if (pj) Object.keys(pj).forEach(mid => Object.keys(pj[mid] || {}).forEach(id => setPhotos(mid, id, (pj[mid][id] || []).filter(safeImg))));
  } catch (e) {}
  const persistPhotos = () => {
    try { localStorage.setItem(PKEY, JSON.stringify(S.photos)); } catch (e) { throw new Error('photo_quota'); }
  };
  Store.savePhotos = async (memberId, mid, imgs) => {
    const prev = S.photos[mid] ? clone(S.photos[mid]) : null;
    if (imgs.length) setPhotos(mid, memberId, imgs.slice()); else if (S.photos[mid]) delete S.photos[mid][memberId];
    try { persistPhotos(); } catch (e) { if (prev) S.photos[mid] = prev; else delete S.photos[mid]; throw e; }
    render(true);
  };
  const persist = () => {
    try { localStorage.setItem(KEY, JSON.stringify({ meetings: S.meetings, members: S.members, wishes: S.wishes, dexImgs: S.dexImgs })); }
    catch (e) { toast('이 브라우저에 저장하지 못했어요'); }
  };
  Store.saveMeeting = async m => {
    const i = S.meetings.findIndex(x => x.id === m.id);
    if (i >= 0) S.meetings[i] = m; else S.meetings.push(m);
    persist(); render(true);
  };
  Store.deleteMeeting = async id => { S.meetings = S.meetings.filter(x => x.id !== id); delete S.photos[id]; try { persistPhotos(); } catch (e) {} persist(); render(true); };
  Store.saveWish = async w => {
    const i = S.wishes.findIndex(x => x.id === w.id);
    if (i >= 0) S.wishes[i] = w; else S.wishes.push(w);
    persist(); render(true);
  };
  Store.deleteWish = async id => { S.wishes = S.wishes.filter(x => x.id !== id); persist(); render(true); };
  Store.saveDex = async (key, img) => { S.dexImgs[key] = img; persist(); render(true); };
  Store.deleteDex = async key => { delete S.dexImgs[key]; persist(); render(true); };
  Store.updateMember = async (memberId, fn) => {
    const cur = S.members[memberId] ? clone(S.members[memberId]) : null;
    S.members[memberId] = fn(cur);
    persist(); render(true);
  };
  S.ready = true;
  render(true);
}

/* ---------- derived data ---------- */
function memberList(){
  return Object.keys(S.members).map(id => {
    const d = S.members[id] || {};
    return { id: id, d: d, name: String(d.nickname || '').trim() || '이름 없음' };
  }).sort((a, b) => ((a.d.createdAt || 0) - (b.d.createdAt || 0)) || a.id.localeCompare(b.id))
    .map((x, i) => Object.assign(x, { i: i }));
}
function meetingStats(mid){
  const rs = [];
  memberList().forEach(mem => {
    const r = mem.d.entries && mem.d.entries[mid];
    if (r && r.overall) rs.push({ mem: mem, r: r });
  });
  const col = k => mean(rs.map(x => x.r[k]).filter(v => v > 0));
  return { rs: rs, overall: col('overall'), neta: col('neta'), shari: col('shari'), value: col('value') };
}
let NUMS = {};
function calcNums(){
  const list = S.meetings.filter(m => m && m.date).slice()
    .sort((a, b) => String(a.date).localeCompare(String(b.date)) || (a.createdAt || 0) - (b.createdAt || 0));
  const out = {}; let n = 0;
  list.forEach(m => { const k = Math.floor(Number(m.no)); n = k > 0 ? k : n + 1; out[m.id] = n; });
  return out;
}
const nth = id => NUMS[id] ? '제' + NUMS[id] + '회' : '';

function attendeesOf(m){
  const mems = memberList();
  const ids = Array.isArray(m.attendees) ? m.attendees.slice() : mems.map(x => x.id);
  mems.forEach(x => {
    const r = x.d.entries && x.d.entries[m.id];
    if (r && r.overall && ids.indexOf(x.id) < 0) ids.push(x.id);
  });
  return mems.filter(x => ids.indexOf(x.id) >= 0);
}
const isMine = id => S.mode === 'db' && id === S.meId;
const canEditReview = id => S.mode === 'local' || (isMine(id) && S.canReview);

/* ---------- nigiri rating ---------- */
const NIGIRI = cls => '<svg class="nig ' + cls + '" viewBox="0 0 32 20" aria-hidden="true"><rect class="rice" x="4" y="9" width="24" height="9" rx="4.5"/><path class="neta" d="M2 10.5C2 5 8.5 2.5 16 2.5S30 5 30 10.5C30 13 24 14 16 14S2 13 2 10.5Z"/></svg>';
function piece(f){
  return '<span class="pc"><span class="pc-off">' + NIGIRI('off') + '</span><span class="pc-on" style="clip-path:inset(0 ' + ((1 - f) * 100).toFixed(1) + '% 0 0)">' + NIGIRI('on') + '</span></span>';
}
function pieces(v){
  const val = v || 0; let s = '';
  for (let i = 0; i < 5; i++) s += piece(Math.max(0, Math.min(1, val - i)));
  return '<span class="pcs" role="img" aria-label="5점 만점에 ' + fmt(v == null ? 0 : v) + '점">' + s + '</span>';
}
function avatar(mem, cls){
  return '<span class="av ' + (cls || '') + '" style="--c:var(--m' + (mem.i % 6) + ')" aria-hidden="true">' + esc(initial(mem.name)) + '</span>';
}

/* ---------- views ---------- */
function mascot(w, color){
  return '<svg class="mascot" width="' + w + '" viewBox="0 0 96 64" aria-hidden="true">' +
    '<rect class="mk-rice" x="12" y="36" width="72" height="24" rx="12"/>' +
    '<path class="mk-neta"' + (color ? ' style="fill:' + color + ';stroke:rgba(0,0,0,.1);stroke-width:1.4"' : '') + ' d="M6 34C6 14 26 8 48 8S90 14 90 34C90 42 70 45 48 45S6 42 6 34Z"/>' +
    '<path class="mk-fat" d="M22 19Q30 13 41 14M60 14Q70 14 76 20"/>' +
    '<circle class="mk-eye" cx="35" cy="27" r="3.3"/><circle class="mk-eye" cx="61" cy="27" r="3.3"/>' +
    '<ellipse class="mk-blush" cx="26" cy="34" rx="5.5" ry="3.2"/><ellipse class="mk-blush" cx="70" cy="34" rx="5.5" ry="3.2"/>' +
    '<path class="mk-mouth" d="M43 32Q48 38 53 32"/></svg>';
}
const emptyBox = txt => '<div class="empty-msg">' + mascot(72) + '<p>' + txt + '</p></div>';
const app = $('#app');

function render(keep){
  if (S.mode === 'db' && S.gate !== 'ready') { renderGate(); return; }
  NUMS = calcNums();
  const ae = document.activeElement;
  const keepQ = ae && ae.id === 'mapq' ? [ae.selectionStart, ae.selectionEnd] : null;
  const y = window.scrollY;
  if (!S.ready) { app.innerHTML = '<div class="skel">' + mascot(84) + '<p>불러오는 중…</p></div>'; return; }
  const mems = memberList();
  let body;
  if (S.detail) body = viewDetail();
  else if (S.store) body = viewStore();
  else if (S.memberView) body = viewMemberReviews();
  else if (S.tab === 'rank') body = viewRank();
  else if (S.tab === 'map') body = viewMap();
  else if (S.tab === 'dex') body = viewDex();
  else if (S.tab === 'members') body = viewMembers();
  else body = viewLog();
  const stack = mems.slice(0, 6).map(m => avatar(m)).join('');
  const tabs = [['log', '기록'], ['rank', '순위'], ['map', '지도'], ['dex', '도감'], ['members', '멤버']].map(t =>
    '<button class="tab" data-act="tab" data-tab="' + t[0] + '"' + (S.tab === t[0] ? ' aria-current="page"' : '') + '>' + t[1] + '</button>').join('');
  app.innerHTML =
    '<header class="top">' + mascot(78) + '<div class="ttl"><h1>정상회담</h1><p class="sub">한 달에 한 번,<br>초밥 먹고 점수 남기는 모임</p></div><div class="stack" aria-label="멤버 ' + mems.length + '명">' + stack + '</div></header>' +
    '<nav class="tabs" aria-label="메뉴">' + tabs + '</nav>' + notices() + '<main>' + body + '</main>';
  window.scrollTo(0, keep ? y : 0);
  if (!S.detail && S.tab === 'map') attachMap();
  if (keepQ) { const q2 = $('#mapq'); if (q2) { q2.focus({ preventScroll: true }); try { q2.setSelectionRange(keepQ[0], keepQ[1]); } catch (e) {} } }
  syncPhotos();
}

function notices(){
  let h = '';
  if (S.error) h += '<div class="note warn">' + esc(S.error) + '</div>';
  if (S.mode === 'local') {
    h += '<div class="note">아직 Firebase 설정 전이라 기록이 이 기기에만 저장돼요. 설정 가이드를 따라 하면 4명이 함께 쓸 수 있어요.</div>';
  } else {
    const mine = S.members[S.meId];
    if (S.canReview && !(mine && mine.nickname)) {
      h += '<div class="note act"><span>모임에서 쓸 이름을 정해 주세요.</span><button class="btn" data-act="setName">이름 정하기</button></div>';
    }
    if (!S.canReview) h += '<div class="note">보기 전용이라 기록을 남길 수 없어요. 링크를 보낸 사람에게 권한을 요청해 주세요.</div>';
  }
  return h;
}

function rowHtml(m, st, upcoming){
  const d = pd(m.date);
  const chips = attendeesOf(m).map(mem => {
    const r = mem.d.entries && mem.d.entries[m.id];
    return '<span class="chip' + (r && r.overall ? '' : ' dim') + '">' + avatar(mem) + '<b>' + (r && r.overall ? r.overall : '–') + '</b></span>';
  }).join('');
  const right = upcoming
    ? '<span class="tag">예정</span>'
    : '<span class="n">' + fmt(st.overall) + '</span>' + pieces(st.overall);
  const cvHtml = safeImg(m.cover) ? '<span class="cv"><img src="' + m.cover + '" alt="" loading="lazy"></span>' : '';
  return '<button class="row" data-act="open" data-id="' + esc(m.id) + '">' + cvHtml +
    '<span class="dt"><span class="mo">' + (d.getMonth() + 1) + '월</span><span class="dy">' + d.getDate() + '</span></span>' +
    '<span><span class="no">' + nth(m.id) + '</span><span class="rn">' + esc(m.restaurant) + '</span>' + (m.area ? '<span class="ra">' + esc(m.area) + '</span>' : '') +
    (upcoming ? '' : '<span class="chips">' + chips + '</span>') + '</span>' +
    '<span class="sc">' + right + '</span></button>';
}

function viewLog(){
  const today = todayStr();
  const all = S.meetings.filter(m => m && m.date && m.restaurant).map(m => ({ m: m, st: meetingStats(m.id) }));
  const upcoming = all.filter(x => x.m.date >= today && x.st.rs.length === 0).sort((a, b) => a.m.date.localeCompare(b.m.date));
  const past = all.filter(x => upcoming.indexOf(x) < 0).sort((a, b) => byDateDesc(a.m, b.m));
  let h = '';
  if (upcoming.length) {
    const m = upcoming[0].m, dd = daysUntil(m.date);
    h += '<button class="next" data-act="open" data-id="' + esc(m.id) + '"><span class="dd">' + (dd === 0 ? '오늘' : 'D-' + dd) + '</span>' +
      '<span class="nx"><span class="nx-l">' + nth(m.id) + ' 정상회담</span><span class="nx-n">' + esc(m.restaurant) + '</span><span class="nx-w">' + shortDate(m.date) + (m.area ? ' / ' + esc(m.area) : '') + ' / 참석 ' + attendeesOf(m).length + '명</span></span></button>';
  } else {
    h += '<div class="next empty">' + mascot(60) + '<span class="nx"><span class="nx-n" style="font-size:19px">다음 모임이 아직 없어요</span><span class="nx-w">날짜와 가게가 정해지면 추가해 두세요.</span></span></div>';
  }
  h += '<div class="sec"><h2>모임 기록</h2>' + (S.canMeet ? '<button class="btn pri" data-act="addMeeting">모임 추가</button>' : '') + '</div>';
  const rows = upcoming.slice(1).map(x => ({ x: x, up: true })).concat(past.map(x => ({ x: x, up: false })));
  if (!rows.length) {
    h += emptyBox('아직 기록이 없어요.<br>첫 모임을 추가하고 점수를 남겨 보세요.');
  } else {
    let lastYear = null;
    rows.forEach(r => {
      const y = pd(r.x.m.date).getFullYear();
      if (y !== lastYear) { h += '<div class="yr">' + y + '년</div>'; lastYear = y; }
      h += rowHtml(r.x.m, r.x.st, r.up);
    });
  }
  return h;
}

function catRows(st){
  return [['neta', '네타', '재료'], ['shari', '샤리', '밥'], ['value', '가성비', '']].map(c =>
    '<div class="drow"><span>' + c[1] + (c[2] ? '<small>' + c[2] + '</small>' : '') + '</span><span class="v">' + pieces(st[c[0]]) + '<span>' + fmt(st[c[0]]) + '</span></span></div>').join('');
}

function viewDetail(){
  const m = S.meetings.find(x => x.id === S.detail);
  if (!m) { S.detail = null; return viewLog(); }
  const st = meetingStats(m.id);
  const att = attendeesOf(m);
  let h = '<button class="back" data-act="back">‹ ' + ((S.store || S.memberView) ? '후기 목록으로' : S.tab === 'rank' ? '순위로' : S.tab === 'map' ? '지도로' : S.tab === 'dex' ? '도감으로' : '기록으로') + '</button>';
  if (safeImg(m.cover)) h += '<button class="cover" data-act="zoomCover" data-mid="' + esc(m.id) + '" aria-label="대표 사진 크게 보기"><img src="' + m.cover + '" alt="대표 사진"></button>';
  h += '<p class="d-date"><span class="no-pill">' + nth(m.id) + ' 정상회담</span>' + longDate(m.date) + '</p><h2 class="d-name">' + esc(m.restaurant) + '</h2>';
  const meta = [];
  if (m.area) meta.push('<span>' + esc(m.area) + '</span>');
  if (m.price) meta.push('<span>1인 ' + won(m.price) + '</span>');
  if (meta.length) h += '<div class="d-meta">' + meta.join('') + '</div>';
  h += '<div class="att"><span class="att-n">참석 ' + att.length + '명</span>' + att.map(x => '<span class="chip">' + avatar(x) + esc(x.name) + '</span>').join('') + '</div>';
  const igu = safeUrl(m.instaUrl);
  h += placeLinksHtml(m, igu ? [['인스타그램', igu]] : []);
  if (m.memo) h += '<div class="d-memo">' + esc(m.memo) + '</div>';
  if (S.canMeet) h += '<p style="margin:10px 0 0"><button class="btn ghost" data-act="editMeeting" data-id="' + esc(m.id) + '" style="padding-left:0;font-size:16px">모임 정보 수정</button></p>';

  if (st.rs.length) {
    h += '<section class="sum"><div class="sum-top"><span class="big">' + fmt(st.overall) + '</span><div>' + pieces(st.overall) +
      '<div class="sum-cnt">' + st.rs.length + '명이 평가했어요</div></div></div>' + catRows(st) + '</section>';
  }

  if (S.mode === 'db') {
    if (S.canReview) {
      const mine = S.members[S.meId];
      const has = mine && mine.entries && mine.entries[m.id] && mine.entries[m.id].overall;
      h += '<button class="btn pri wide" data-act="review" data-id="' + esc(m.id) + '" data-member="' + esc(S.meId) + '" style="margin:' + (st.rs.length ? '0' : '18px') + ' 0 14px">' + (has ? '내 후기 수정' : '내 후기 쓰기') + '</button>';
    }
  } else {
    h += '<button class="btn pri wide" data-act="review" data-id="' + esc(m.id) + '" style="margin:' + (st.rs.length ? '0' : '18px') + ' 0 14px">후기 쓰기</button>';
  }

  att.forEach(mem => {
    const r = mem.d.entries && mem.d.entries[m.id];
    if (!r || !r.overall) {
      h += '<div class="rv none"><div class="rv-h">' + avatar(mem, 'lg') + '<span class="nm">' + esc(mem.name) + '</span></div><div style="margin-top:6px">아직 평가하지 않았어요.</div></div>';
      return;
    }
    const det = [['neta', '네타'], ['shari', '샤리'], ['value', '가성비']].filter(c => r[c[0]] > 0).map(c => '<span>' + c[1] + ' ' + r[c[0]] + '</span>').join('');
    const pl = (S.photos[m.id] && S.photos[m.id][mem.id]) || [];
    const phHtml = pl.length ? '<div class="phs">' + pl.map((src, i) => '<button class="ph" data-act="zoom" data-mid="' + esc(m.id) + '" data-member="' + esc(mem.id) + '" data-i="' + i + '" aria-label="사진 크게 보기"><img src="' + src + '" alt="" loading="lazy"></button>').join('') + '</div>' : '';
    h += '<div class="rv"><div class="rv-h">' + avatar(mem, 'lg') + '<span class="nm">' + esc(mem.name) + '</span>' +
      (canEditReview(mem.id) ? '<button class="btn ghost" data-act="review" data-id="' + esc(m.id) + '" data-member="' + esc(mem.id) + '">수정</button>' : '') + '</div>' +
      '<div class="rv-s"><b>' + r.overall + '</b>' + pieces(r.overall) + '</div>' +
      (det ? '<div class="rv-d">' + det + '</div>' : '') +
      (r.best ? '<div class="rv-best"><b>오늘의 한 점</b>&nbsp; ' + esc(r.best) + '</div>' : '') +
      (r.comment ? '<p>' + esc(r.comment) + '</p>' : '') + phHtml + '</div>';
  });
  if (!att.length) h += emptyBox('참석 멤버가 없어요.<br>"모임 정보 수정"에서 참석자를 골라 주세요.');
  return h;
}

function viewMemberReviews(){
  const mem = memberList().find(x => x.id === S.memberView);
  if (!mem) { S.memberView = null; return viewMembers(); }
  const byId = {};
  S.meetings.forEach(m => { if (m) byId[m.id] = m; });
  const items = Object.keys(mem.d.entries || {}).filter(k => byId[k] && mem.d.entries[k] && mem.d.entries[k].overall)
    .map(k => ({ m: byId[k], r: mem.d.entries[k] })).sort((a, b) => byDateDesc(a.m, b.m));
  const col = k => mean(items.map(x => x.r[k]).filter(v => v > 0));
  const avg = mean(items.map(x => x.r.overall));
  let h = '<button class="back" data-act="memberBack">‹ 멤버로</button>';
  h += '<div class="mhead">' + avatar(mem, 'lg') + '<div><h2 class="d-name" style="font-size:27px">' + esc(mem.name) + (isMine(mem.id) ? ' (나)' : '') + '</h2><div class="d-meta" style="margin:0"><span>후기 ' + items.length + '개</span></div></div></div>';
  if (!items.length) return h + emptyBox('아직 남긴 후기가 없어요.');
  h += '<section class="sum"><div class="sum-top"><span class="big">' + fmt(avg) + '</span><div>' + pieces(avg) + '<div class="sum-cnt">' + esc(mem.name) + '님이 준 종합 점수의 평균</div></div></div>' +
    catRows({ neta: col('neta'), shari: col('shari'), value: col('value') }) + '</section>';
  items.forEach(x => {
    const m = x.m, r = x.r;
    const det = [['neta', '네타'], ['shari', '샤리'], ['value', '가성비']].filter(c => r[c[0]] > 0).map(c => '<span>' + c[1] + ' ' + r[c[0]] + '</span>').join('');
    h += '<section class="rv"><div class="visit-h"><span class="no-pill">' + esc(nth(m.id)) + '</span><span class="visit-d">' + shortDate(m.date) + '</span>' +
      '<span style="margin-left:auto;display:flex;gap:2px">' + (canEditReview(mem.id) ? '<button class="btn ghost" data-act="review" data-id="' + esc(m.id) + '" data-member="' + esc(mem.id) + '">수정</button>' : '') +
      '<button class="btn ghost" data-act="open" data-id="' + esc(m.id) + '">사진·상세</button></span></div>' +
      '<div class="rn">' + esc(m.restaurant) + '</div>' +
      '<div class="rv-s"><b>' + r.overall + '</b>' + pieces(r.overall) + '</div>' +
      (det ? '<div class="rv-d">' + det + '</div>' : '') +
      (r.best ? '<div class="rv-best"><b>오늘의 한 점</b>&nbsp; ' + esc(r.best) + '</div>' : '') +
      (r.comment ? '<p>' + esc(r.comment) + '</p>' : '') + '</section>';
  });
  return h;
}

const normKey = t => String(t || '').trim().toLowerCase().replace(/\s+/g, '');
function viewRank(){
  const groups = {};
  S.meetings.forEach(m => {
    if (!m || !m.restaurant || !m.date) return;
    const st = meetingStats(m.id);
    if (st.overall == null) return;
    const key = normKey(m.restaurant);
    const g = groups[key] || (groups[key] = { list: [], name: m.restaurant, last: '', cat: { neta: [], shari: [], value: [] } });
    g.list.push(st.overall);
    ['neta', 'shari', 'value'].forEach(c => { if (st[c] != null) g.cat[c].push(st[c]); });
    if (m.date > g.last) { g.last = m.date; g.name = m.restaurant; }
  });
  const arr = Object.keys(groups).map(k => ({ key: k, name: groups[k].name, avg: mean(groups[k].list), n: groups[k].list.length, last: groups[k].last, cat: { neta: mean(groups[k].cat.neta), shari: mean(groups[k].cat.shari), value: mean(groups[k].cat.value) } }))
    .sort((a, b) => b.avg - a.avg || b.n - a.n);
  let h = '<div class="sec"><h2>가게 순위</h2></div>';
  if (!arr.length) return h + emptyBox('평가가 쌓이면 순위가 만들어져요.');
  h += '<p class="hint" style="margin:0">종합 점수와 네타·샤리·가성비 점수 모두 평균이에요. 가게를 누르면 후기를 볼 수 있어요.</p><ol class="rank">';
  arr.forEach((g, i) => {
    h += '<li><button class="rkrow" data-act="openStore" data-key="' + esc(g.key) + '"><span class="rk">' + (i + 1) + '</span><span><span class="rn">' + esc(g.name) + '</span><span class="ra cats">' + ([['neta', '네타'], ['shari', '샤리'], ['value', '가성비']].filter(c => g.cat[c[0]] != null).map(c => '<span>' + c[1] + ' ' + fmt(g.cat[c[0]]) + '</span>').join('') || '<span>세부 점수는 아직 없어요</span>') + '</span></span>' +
      '<span class="sc"><span class="n">' + fmt(g.avg) + '</span>' + pieces(g.avg) + '</span></button></li>';
  });
  return h + '</ol>';

function viewStore(){

function viewMembers(){
  const ids = {}; S.meetings.forEach(m => { ids[m.id] = true; });
  const mems = memberList();
  const per = mems.map(mem => {
    const vals = Object.keys(mem.d.entries || {}).filter(k => ids[k] && mem.d.entries[k].overall).map(k => mem.d.entries[k].overall);
    return { mem: mem, n: vals.length, avg: mean(vals), vals: vals };
  });
  const everything = [].concat.apply([], per.map(p => p.vals));
  const gAvg = mean(everything);
  const today = todayStr();
  const came = {};
  mems.forEach(x => { came[x.id] = 0; });
  S.meetings.forEach(m => {
    if (!m || !m.date) return;
    const has = mems.some(x => x.d.entries && x.d.entries[m.id] && x.d.entries[m.id].overall);
    if (m.date > today && !has) return;
    attendeesOf(m).forEach(x => { came[x.id]++; });
  });
  let h = '<div class="sec"><h2>멤버 ' + mems.length + '명</h2>' +
    (S.mode === 'local' ? '<button class="btn" data-act="addMember">멤버 추가</button>' : '') + '</div>';
  h += '<p class="hint" style="margin:0">멤버를 누르면 그 사람이 남긴 후기를 모아서 볼 수 있어요.</p>';
  if (S.mode === 'db' && mems.length < 4) h += '<p class="hint">4명이 모두 합류하면 좋아요. 링크를 공유하고 각자 이름을 정해 달라고 해 보세요.</p>';
  if (!mems.length) h += emptyBox(S.mode === 'local' ? '멤버를 추가해 주세요.' : '아직 합류한 멤버가 없어요.');
  per.forEach(p => {
    let tend = '참석 ' + came[p.mem.id] + '회, ' + (p.n ? '후기 ' + p.n + '개' : '후기 없음');
    if (p.n >= 2 && gAvg != null && everything.length > p.n) {
      const diff = p.avg - gAvg;
      tend += diff > 0.3 ? ', 후한 편' : diff < -0.3 ? ', 짠 편' : ', 무난한 편';
    }
    h += '<div class="mem"><button class="memmain" data-act="openMember" data-id="' + esc(p.mem.id) + '">' + avatar(p.mem, 'lg') + '<span class="grow"><span class="nm" style="display:block">' + esc(p.mem.name) + (isMine(p.mem.id) ? ' (나)' : '') + '</span><span class="st" style="display:block">' + tend + '</span></span>' +
      (p.n ? '<span class="sc"><span class="n">' + fmt(p.avg) + '</span>' + pieces(p.avg) + '</span>' : '') + '</button>' +
      (S.mode === 'local' || isMine(p.mem.id) ? '<button class="btn ghost" data-act="rename" data-id="' + esc(p.mem.id) + '">이름 수정</button>' : '') + '</div>';
  });
  h += installCard();
  if (S.mode === 'db') h += '<div class="acct"><p class="hint">' + esc((S.user && S.user.email) || '') + ' 계정으로 로그인 중</p><button class="btn" data-act="gLogout" style="margin-top:10px">로그아웃</button></div>';
  return h;
}

  if (e && e.code === 'timeout') return '인터넷 연결이 불안정해요. 연결되면 자동으로 저장돼요.';

/* photos */
const MAX_IMG_CHARS = 110000;
function loadImage(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => { URL.revokeObjectURL(url); res(im); };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('load')); };
    im.src = url;
  });
}
async function compressImage(file){
  const im = await loadImage(file);
  const W = im.naturalWidth, H = im.naturalHeight;
  if (!W || !H) throw new Error('size');
  for (const D of [1080, 900, 720, 560, 440]) {
    const sc = Math.min(1, D / Math.max(W, H));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(W * sc)); c.height = Math.max(1, Math.round(H * sc));
    const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
    x.drawImage(im, 0, 0, c.width, c.height);
    for (const q of [0.75, 0.62, 0.5]) {
      const u = c.toDataURL('image/jpeg', q);
      if (u.length <= MAX_IMG_CHARS && safeImg(u)) return u;
    }
  }
  throw new Error('too_big');
}
const COVER_MAX = 60000;
function coverFromImage(im){
  const W = im.naturalWidth, H = im.naturalHeight;
  if (!W || !H) throw new Error('size');
  for (const D of [520, 440, 360, 300]) {
    const sc = Math.min(1, D / Math.max(W, H));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(W * sc)); c.height = Math.max(1, Math.round(H * sc));
    const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
    x.drawImage(im, 0, 0, c.width, c.height);
    for (const q of [0.72, 0.6, 0.5]) {
      const u = c.toDataURL('image/jpeg', q);
      if (u.length <= COVER_MAX && safeImg(u)) return u;
    }
  }
  throw new Error('too_big');
}
const DEX_MAX = 48000;
function squareFromImage(im){
  const W = im.naturalWidth, H = im.naturalHeight;
  if (!W || !H) throw new Error('size');
  const side = Math.min(W, H), sx = (W - side) / 2, sy = (H - side) / 2;
  for (const D of [400, 340, 280, 240]) {
    const c = document.createElement('canvas');
    c.width = D; c.height = D;
    const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, D, D);
    x.drawImage(im, sx, sy, side, side, 0, 0, D, D);
    for (const q of [0.78, 0.66, 0.55, 0.45]) {
      const u = c.toDataURL('image/jpeg', q);
      if (u.length <= DEX_MAX && safeImg(u)) return u;
    }
  }
  throw new Error('too_big');
}
async function squareFromFile(file){ return squareFromImage(await loadImage(file)); }
async function coverFromFile(file){ return coverFromImage(await loadImage(file)); }
function coverFromData(src){
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => { try { res(coverFromImage(im)); } catch (e) { rej(e); } };
    im.onerror = () => rej(new Error('load'));
    im.src = src;
  });
}

      input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
    });
}

/* review sheet */
function rateGroup(g, val){
  let s = '';
  for (let i = 1; i <= 5; i++) {
    const f = Math.max(0, Math.min(1, val - (i - 1)));
    s += '<span class="rp">' + piece(f) +
      '<button type="button" class="rh l" role="radio" aria-checked="' + (val === i - 0.5) + '" aria-label="' + (i - 0.5) + '점" data-rate="' + g + '" data-v="' + (i - 0.5) + '"></button>' +
      '<button type="button" class="rh r" role="radio" aria-checked="' + (val === i) + '" aria-label="' + i + '점" data-rate="' + g + '" data-v="' + i + '"></button></span>';
  }
  return s;
}
function openReviewSheet(mid, memberId){
  const m = S.meetings.find(x => x.id === mid);
  if (!m) return;
  const mems = memberList();
  if (S.mode === 'local' && !mems.length) { openNameSheet(null, () => openReviewSheet(mid)); return; }
  if (S.mode === 'db' && !(S.members[S.meId] && S.members[S.meId].nickname)) { openNameSheet(S.meId, () => openReviewSheet(mid, S.meId)); return; }
  const who = memberId || (S.mode === 'db' ? S.meId : mems[0].id);
  const doc = S.members[who] || {};
  const ex = (doc.entries && doc.entries[mid]) || {};
  const F = { overall: ex.overall || 0, neta: ex.neta || 0, shari: ex.shari || 0, value: ex.value || 0 };
  const picker = S.mode === 'local'
    ? '<div class="who" role="group" aria-label="작성자">' + mems.map(x => '<button type="button" data-who="' + esc(x.id) + '" aria-pressed="' + (x.id === who) + '">' + avatar(x) + esc(x.name) + '</button>').join('') + '</div>'
    : '';
  const origP = ((S.photos[mid] || {})[who] || []).slice();
  const P = origP.slice();
  const detailRow = (g, label, hint) => '<div class="drow"><span>' + label + '<small>' + hint + '</small></span><div class="rate-wrap"><div class="rate" role="radiogroup" aria-label="' + label + '" data-g="' + g + '">' + rateGroup(g, F[g]) + '</div><span class="rout" data-out="' + g + '">' + (F[g] || '') + '</span></div></div>';
  openSheet('후기 쓰기',
    '<h3>' + esc(m.restaurant) + '</h3><p class="hint">' + shortDate(m.date) + '</p>' + picker +
    '<div class="lab" style="margin-top:18px">종합 점수 <span id="ov-n" style="font-family:var(--sans);font-size:14px;color:var(--ink2)"></span></div>' +
    '<div class="rate big" role="radiogroup" aria-label="종합 점수" data-g="overall">' + rateGroup('overall', F.overall) + '</div>' +
    '<p class="hint" style="margin-top:4px">초밥의 왼쪽 절반을 누르면 0.5점, 오른쪽 절반을 누르면 1점 단위예요.</p>' +
    '<div class="lab" style="margin-top:18px">세부 점수 <span style="font-family:var(--sans);font-size:14px;color:var(--ink2)">(다시 누르면 취소돼요)</span></div>' +
    detailRow('neta', '네타', '재료') + detailRow('shari', '샤리', '밥') + detailRow('value', '가성비', '') +
    '<div class="lab">사진 <span style="font-family:var(--sans);font-size:14px;color:var(--ink2)">(최대 3장)</span></div><div class="pgrid" id="pgrid"></div><input type="file" id="f-file" accept="image/*" multiple hidden><div class="pstat" id="pstat" aria-live="polite"></div>' +
    '<label for="f-best">오늘의 한 점</label><input id="f-best" maxlength="30" value="' + esc(ex.best || '') + '" placeholder="예: 중뱃살, 성게">' +
    '<label for="f-cmt">한줄평</label><textarea id="f-cmt" maxlength="300" placeholder="맛, 분위기, 다음에 또 갈지 등">' + esc(ex.comment || '') + '</textarea>' +
    '<div class="err" id="err"></div>' +
    '<div class="actions">' + (ex.overall ? '<button class="btn warn" id="del">삭제</button>' : '<button class="btn" data-act="sheetClose">취소</button>') + '<button class="btn pri" id="save">저장</button></div>',
    sheet => {
      const err = sheet.querySelector('#err');
      const ovn = sheet.querySelector('#ov-n');
      const pgrid = sheet.querySelector('#pgrid'), pstat = sheet.querySelector('#pstat'), fileIn = sheet.querySelector('#f-file');
      let working = false;
      const drawP = () => {
        pgrid.innerHTML = P.map((src, i) => '<div class="pth"><img src="' + src + '" alt="사진 ' + (i + 1) + '"><button type="button" data-pdel="' + i + '" aria-label="사진 ' + (i + 1) + ' 삭제">×</button></div>').join('') +
          (P.length < 3 ? '<button type="button" class="padd" data-padd="1">+ 사진 추가</button>' : '');
      };
      drawP();
      fileIn.addEventListener('change', async () => {
        const files = Array.from(fileIn.files || []).slice(0, 3 - P.length);
        fileIn.value = '';
        if (!files.length) return;
        working = true; pstat.textContent = '사진을 처리하는 중…'; err.textContent = '';
        let failed = 0;
        for (const f of files) {
          try { P.push(await compressImage(f)); drawP(); } catch (e) { failed++; }
        }
        working = false;
        pstat.textContent = failed ? '사진 ' + failed + '장을 불러오지 못했어요.' : '';
      });
      const showOv = () => { ovn.textContent = F.overall ? F.overall + '점' : ''; };
      showOv();
      sheet.addEventListener('click', e => {
        if (e.target.closest('[data-padd]')) { fileIn.click(); return; }
        const pd2 = e.target.closest('[data-pdel]');
        if (pd2) { P.splice(Number(pd2.dataset.pdel), 1); drawP(); pstat.textContent = ''; return; }
        const r = e.target.closest('[data-rate]');
        if (r) {
          const g = r.dataset.rate, v = Number(r.dataset.v);
          F[g] = (F[g] === v && g !== 'overall') ? 0 : v;
          sheet.querySelector('[data-g="' + g + '"]').innerHTML = rateGroup(g, F[g]);
          if (g === 'overall') showOv();
          const outEl = sheet.querySelector('[data-out="' + g + '"]');
          if (outEl) outEl.textContent = F[g] || '';
          err.textContent = '';
          return;
        }
        const w = e.target.closest('[data-who]');
        if (w) openReviewSheet(mid, w.dataset.who);
      });
      sheet.querySelector('#save').addEventListener('click', ev => {
        if (working) { err.textContent = '사진을 처리하는 중이에요. 잠시만 기다려 주세요.'; return; }
        if (!F.overall) { err.textContent = '종합 점수를 골라 주세요.'; return; }
        const entry = {
          overall: F.overall, neta: F.neta, shari: F.shari, value: F.value,
          best: sheet.querySelector('#f-best').value.trim(), comment: sheet.querySelector('#f-cmt').value.trim(), updatedAt: Date.now()
        };
        busy(ev.currentTarget, async () => {
          if (JSON.stringify(P) !== JSON.stringify(origP)) await Store.savePhotos(who, mid, P);
          await Store.updateMember(who, c => {
            const d = c || { nickname: '', entries: {}, createdAt: Date.now() };
            d.entries = d.entries || {}; d.entries[mid] = entry; return d;
          });
          closeSheet(); toast('후기를 저장했어요');
        }, err);
      });
      const del = sheet.querySelector('#del');
      if (del) del.addEventListener('click', ev => {
        if (!del.dataset.sure) { del.dataset.sure = '1'; del.textContent = '정말 삭제'; return; }
        busy(ev.currentTarget, async () => {
          if (origP.length) await Store.savePhotos(who, mid, []);
          await Store.updateMember(who, c => { const d = c || { nickname: '', entries: {}, createdAt: Date.now() }; d.entries = d.entries || {}; delete d.entries[mid]; return d; });
          closeSheet(); toast('후기를 삭제했어요');
        }, err);
      });
    });
}

/* ---------- 지도 / 갈 곳 ---------- */
const hasPos = o => !!o && o.lat != null && o.lng != null && o.lat !== '' && o.lng !== '' &&
  Number.isFinite(Number(o.lat)) && Number.isFinite(Number(o.lng)) && !(Number(o.lat) === 0 && Number(o.lng) === 0);
const shortArea = a => String(a || '').trim().split(/\s+/).slice(0, 2).join(' ').slice(0, 40);
const kakaoKeyOk = () => typeof KAKAO_JS_KEY !== 'undefined' && !!KAKAO_JS_KEY && String(KAKAO_JS_KEY).indexOf('여기') < 0;
const MapView = { state: 'idle', err: '', el: null, map: null, pins: [], fitKey: '' };
let kakaoP = null;

function loadKakao(){
  if (kakaoP) return kakaoP;
  kakaoP = new Promise((res, rej) => {
    const fail = msg => { MapView.state = 'error'; MapView.err = msg; rej(new Error(msg)); };
    if (!kakaoKeyOk()) { fail('카카오 지도 키가 아직 설정되지 않았어요.'); return; }
    MapView.state = 'loading';
    const sc = document.createElement('script');
    sc.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + encodeURIComponent(KAKAO_JS_KEY) + '&libraries=services&autoload=false';
    sc.onload = () => {
      try { kakao.maps.load(() => { MapView.state = 'ready'; res(); }); }
      catch (e) { fail('지도를 불러오지 못했어요. 카카오 설정(도메인 등록, 카카오맵 활성화)을 확인해 주세요.'); }
    };
    sc.onerror = () => fail('지도를 불러오지 못했어요. 카카오 설정(도메인 등록, 카카오맵 활성화)을 확인해 주세요.');
    document.head.appendChild(sc);
  });
  kakaoP.catch(() => {});
  return kakaoP;
}

function mapItems(){
  const items = [];
  S.meetings.forEach(m => {
    if (!m || !m.date || !m.restaurant) return;
    const upcoming = m.date >= todayStr() && meetingStats(m.id).rs.length === 0;
    items.push({ kind: 'done', id: m.id, name: m.restaurant, address: m.area || '', lat: m.lat, lng: m.lng, no: NUMS[m.id], upcoming: upcoming, date: m.date });
  });
  S.wishes.filter(w => w && w.name && w.status !== 'done').forEach(w => {
    items.push({ kind: 'todo', id: w.id, name: w.name, address: w.address || '', lat: w.lat, lng: w.lng, memo: w.memo || '', sunday: w.sunday || '', created: w.createdAt || 0 });
  });
  return items;
}
const normName = t => String(t || '').toLowerCase().replace(/[\s()\-_.,·]/g, '');
function visibleItems(){
  const all = mapItems();
  const q = normName(S.mapQuery);
  if (q) {
    return all.filter(x => {
      const n = normName(x.name);
      return n.indexOf(q) >= 0 || (n.length >= 2 && q.indexOf(n) >= 0) || normName(x.address).indexOf(q) >= 0;
    });
  }
  const f = S.mapFilter;
  return all.filter(x => f === 'all' || (f === 'sun' ? (x.kind === 'todo' && x.sunday === 'open') : f === 'unk' ? (x.kind === 'todo' && !x.sunday) : x.kind === f));
}

function mapMsg(t){ return '<div class="mapmsg"><p>' + t + '</p></div>'; }
function attachMap(){
  const host = $('#mapHost');
  if (!host) return;
  if (!kakaoKeyOk()) { host.innerHTML = mapMsg('지도를 켜려면 카카오 지도 키가 필요해요.<br>설정 가이드 9단계를 따라 해 주세요.<br>그 전에도 갈 곳 목록은 쓸 수 있어요.'); return; }
  if (MapView.state === 'error') { host.innerHTML = mapMsg(esc(MapView.err)); return; }
  if (!MapView.el) { MapView.el = document.createElement('div'); MapView.el.className = 'mapcanvas'; }
  host.appendChild(MapView.el);
  if (MapView.state !== 'ready') {
    host.insertAdjacentHTML('beforeend', '<div class="mapmsg" id="mapLoading"><p>지도를 불러오는 중…</p></div>');
    loadKakao().then(attachMap, attachMap);
    return;
  }
  const ld = host.querySelector('#mapLoading'); if (ld) ld.remove();
  if (!MapView.map) MapView.map = new kakao.maps.Map(MapView.el, { center: new kakao.maps.LatLng(37.5665, 126.978), level: 7 });
  else MapView.map.relayout();
  drawPins();
}
function drawPins(){
  if (!MapView.map) return;
  MapView.pins.forEach(o => o.setMap(null));
  MapView.pins = [];
  const items = visibleItems().filter(hasPos);
  const bounds = new kakao.maps.LatLngBounds();
  items.forEach(it => {
    const b = document.createElement('button');
    const sunOpen = it.kind === 'todo' && it.sunday === 'open';
    b.type = 'button'; b.className = 'pin ' + it.kind + (sunOpen ? ' sun' : '');
    b.textContent = it.kind === 'done' ? (it.no || '●') : (sunOpen ? '일' : '갈');
    b.setAttribute('aria-label', it.name);
    b.addEventListener('click', () => openMapItem(it.kind, it.id));
    const pos = new kakao.maps.LatLng(Number(it.lat), Number(it.lng));
    const ov = new kakao.maps.CustomOverlay({ position: pos, content: b, yAnchor: 1 });
    ov.setMap(MapView.map);
    MapView.pins.push(ov);
    bounds.extend(pos);
  });
  const key = S.mapFilter + '|' + S.mapQuery + '|' + items.map(x => x.id).join(',');
  if (items.length && key !== MapView.fitKey) {
    MapView.fitKey = key;
    if (items.length === 1) { MapView.map.setCenter(new kakao.maps.LatLng(Number(items[0].lat), Number(items[0].lng))); MapView.map.setLevel(4); }
    else MapView.map.setBounds(bounds, 40, 40, 40, 40);
  }
}
function openMapItem(kind, id){
  if (kind === 'done') { S.detail = id; closeSheet(); render(false); }
  else openPlaceInfo(id);
}

function mapListHtml(){

    : (a.kind === 'todo' ? -1 : 1));

    const nT = shown.filter(x => x.kind === 'todo').length, nD = shown.length - nT;
    if (!shown.length) {
      h += '<div class="qbox"><p>"' + esc(q) + '"은(는) 아직 저장되어 있지 않아요.</p>' + (S.canMeet ? '<button class="btn pri" data-act="addPlaceQ">갈 곳으로 추가</button>' : '') + '</div>';
      return h;

  } else if (!shown.length) {
    return emptyBox(S.mapFilter === 'done' ? '아직 다녀온 곳이 없어요.' : S.mapFilter === 'sun' ? '일요일 영업으로 표시한 갈 곳이 없어요.<br>갈 곳을 눌러 "일요일 영업"을 골라 주세요.' : S.mapFilter === 'unk' ? '일요일 영업 여부를 모두 확인했어요!' : '아직 가고 싶은 곳이 없어요.<br>"갈 곳 추가"로 지도에 모아 보세요.');
  }
  shown.forEach(it => {
    const tag = it.kind === 'todo' ? '<span class="tag">갈 곳</span>' + (it.sunday === 'open' ? '<span class="tag sun">일요일 영업</span>' : it.sunday === 'closed' ? '<span class="tag no">일요일 휴무</span>' : '')
      : '<span class="tag acc">' + (it.upcoming ? '예정' : (it.no ? '제' + it.no + '회 다녀옴' : '다녀옴')) + '</span>';
    h += '<button class="pl" data-act="openPlace" data-kind="' + it.kind + '" data-id="' + esc(it.id) + '"><span class="pl-h">' + tag + '</span>' +
      '<span class="rn">' + esc(it.name) + '</span>' +
      '<span class="ra">' + (esc(it.address) || '위치 미등록') + '</span>' +
      (it.memo ? '<span class="pl-m">' + esc(it.memo) + '</span>' : '') +
      (hasPos(it) ? '' : '<span class="pl-m">지도에 표시되지 않아요. 수정해서 "지도에서 찾기"로 위치를 저장해 보세요.</span>') + '</button>';
  });
  return h;
}

function placeLinkList(o){
  const out = [];
  const nm = o.name || o.restaurant || '';
  const link = safeUrl(o.link || o.mapUrl);
  const host = link ? (link.split('/')[2] || '').toLowerCase() : '';
  const isNaver = host.indexOf('naver') >= 0, isKakao = host.indexOf('kakao') >= 0;
  if (link && isNaver) out.push(['네이버 지도', link]);
  else out.push(['네이버 지도에서 찾기', 'https://map.naver.com/p/search/' + encodeURIComponent(nm)]);
  if (safeUrl(o.placeUrl)) out.push(['카카오맵 영업시간 보기', safeUrl(o.placeUrl)]);
  else if (hasPos(o)) out.push(['카카오맵', 'https://map.kakao.com/link/map/' + encodeURIComponent(nm) + ',' + Number(o.lat) + ',' + Number(o.lng)]);
  else if (link && isKakao) out.push(['카카오맵', link]);
  if (link && !isNaver && !isKakao) out.push([(host.indexOf('google') >= 0 || host.indexOf('goo.gl') >= 0) ? '구글 지도' : '링크', link]);
  return out;
}
function placeLinksHtml(o, extra){

function searchBlock(){
  if (!kakaoKeyOk()) return '<p class="hint" style="margin-top:14px">지도에서 가게를 검색하려면 카카오 지도 키 설정이 필요해요. (설정 가이드 9단계) 지금은 직접 적어서 저장할 수 있어요.</p>';
  return '<div class="lab">지도에서 찾기</div><div class="sbar"><input id="f-q" placeholder="가게 이름 검색 (예: 스시 성수)" enterkeyhint="search" autocomplete="off"><button type="button" class="btn" id="f-qgo">검색</button></div><div id="f-res" aria-live="polite"></div><p class="hint" id="f-pick"></p>';
}
function bindSearch(sheet, onPick){
  const q = sheet.querySelector('#f-q');
  if (!q) return;
  const go = sheet.querySelector('#f-qgo'), res = sheet.querySelector('#f-res');
  let results = [];
  const run = async () => {
    const term = q.value.trim();
    if (!term) return;
    res.innerHTML = '<p class="hint">찾는 중…</p>';
    try { await loadKakao(); }
    catch (e) { res.innerHTML = '<p class="hint" style="color:var(--accent)">' + esc(MapView.err || '지도를 불러오지 못했어요.') + '</p>'; return; }
    new kakao.maps.services.Places().keywordSearch(term, (data, status) => {
      const St = kakao.maps.services.Status;
      if (status === St.OK) {
        results = data.slice(0, 8);
        res.innerHTML = results.map((r, i) => '<button type="button" class="sr" data-sr="' + i + '"><span class="sr-n">' + esc(r.place_name) + '</span><span class="sr-a">' + esc(r.road_address_name || r.address_name || '') + '</span>' +
          (r.category_name ? '<span class="sr-c">' + esc(String(r.category_name).split(' > ').slice(-1)[0]) + '</span>' : '') + '</button>').join('');
      } else if (status === St.ZERO_RESULT) {
        res.innerHTML = '<p class="hint">검색 결과가 없어요. 다른 이름으로 찾아보세요.</p>';
      } else {
