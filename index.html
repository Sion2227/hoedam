const NETA_ALIAS = {
  '오도로': '대뱃살', '대토로': '대뱃살', '오오토로': '대뱃살', '대뱃살': '대뱃살',
  '츄토로': '중뱃살', '주도로': '중뱃살', '중토로': '중뱃살', '쥬토로': '중뱃살',
  '우니': '성게', '성게알': '성게', '우니성게': '성게',
  '사케': '연어', '사몬': '연어', '에비': '새우', '아나고': '붕장어', '우나기': '장어',
  '타마고': '계란', '다마고': '계란', '달걀': '계란', '계란말이': '계란',
  '이쿠라': '연어알', '호타테': '가리비', '타이': '도미', '히라메': '광어', '부리': '방어',
  '아지': '전갱이', '사바': '고등어', '시메사바': '고등어', '이카': '오징어', '타코': '문어', '카니': '게',
  '아카미': '참치 붉은살', '붉은살': '참치 붉은살', '마구로': '참치', '아마에비': '단새우'
};
const NETA_COLORS = [
  [/연어알|이쿠라|명란|날치알/, '#FF6A3D'], [/뱃살|토로/, '#F58C9B'], [/참치|마구로|아카미|붉은살|다랑어/, '#E5566B'],
  [/연어|사케|사몬/, '#FF8A6B'], [/새우|에비/, '#FFA76A'], [/계란|타마고|다마고|달걀/, '#FFD55E'],
  [/장어|아나고|우나기/, '#B0703F'], [/성게|우니/, '#FFB43F'], [/고등어|전갱이|사바|아지|삼치|청어|꽁치/, '#8EB2C7'],
  [/광어|도미|방어|농어|넙치|오징어|한치|문어|가리비|관자|전복|참돔|우럭|해삼|소라|갑오징어/, '#F3E6D6'], [/게|크랩/, '#FF9E8A']
];
const NETA_PALETTE = ['#FFB4C1', '#B7E0C2', '#FFE08A', '#C9B6F2', '#9CD3F0', '#FFC49B'];
function netaColor(name){
  for (let i = 0; i < NETA_COLORS.length; i++) if (NETA_COLORS[i][0].test(name)) return NETA_COLORS[i][1];
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return NETA_PALETTE[h % NETA_PALETTE.length];
}
function canonNeta(raw){
  let n = String(raw || '').replace(/\(.*?\)|（.*?）/g, '').trim();
  if (!n || n.length > 20) return null;
  let k = n.replace(/\s+/g, '').toLowerCase().replace(/(초밥|스시|니기리)$/, '');
  if (!k) return null;
  if (NETA_ALIAS[k]) { n = NETA_ALIAS[k]; k = n.replace(/\s+/g, '').toLowerCase(); }
  return { key: k, name: n };
}
function calcDex(){
  const byId = {};
  S.meetings.forEach(m => { if (m && m.id) byId[m.id] = m; });
  const map = {};
  memberList().forEach(mem => {
    Object.keys(mem.d.entries || {}).forEach(mid => {
      const m = byId[mid], r = mem.d.entries[mid];
      if (!m || !r || !r.best) return;
      const seen = {};
      String(r.best).split(/[,，、\/·+&\n]|\s+(?:및|그리고|와|과)\s+/).forEach(tok => {
        const c = canonNeta(tok);
        if (!c || seen[c.key]) return;
        seen[c.key] = 1;
        const e = map[c.key] || (map[c.key] = { key: c.key, spells: {}, picks: [] });
        e.spells[c.name] = (e.spells[c.name] || 0) + 1;
        e.picks.push({ mid: mid, mem: mem, date: m.date || '', m: m });
      });
    });
  });
  const allDates = {};
  Object.keys(map).forEach(k => map[k].picks.forEach(p => { allDates[p.date] = 1; }));
  const dates = Object.keys(allDates).sort();
  const latest = dates[dates.length - 1];
  const arr = Object.keys(map).map(k => {
    const e = map[k];
    const names = Object.keys(e.spells).sort((a, b) => (e.spells[b] - e.spells[a]) || ((a.indexOf(' ') < 0 ? 0 : 1) - (b.indexOf(' ') < 0 ? 0 : 1)));
    e.name = names[0];
    e.count = e.picks.length;
    const ds = e.picks.map(p => p.date).sort();
    e.first = ds[0]; e.last = ds[ds.length - 1];
    e.color = netaColor(e.name);
    e.isNew = dates.length >= 2 && e.first === latest && ds.every(d => d === latest);
    return e;
  }).sort((a, b) => (b.count - a.count) || String(b.last).localeCompare(String(a.last)) || a.name.localeCompare(b.name));
  return arr;
}
function dexCard(e){
  const who = [], seenM = {};
  e.picks.forEach(p => { if (!seenM[p.mem.id]) { seenM[p.mem.id] = 1; who.push(p.mem); } });
  const img = safeImg(S.dexImgs[e.key]) ? S.dexImgs[e.key] : '';
  return '<button class="dcard' + (img ? ' hasimg' : '') + '" data-act="openDex" data-key="' + esc(e.key) + '">' +
    (e.isNew ? '<span class="dnew">NEW</span>' : '') + '<span class="dcnt">×' + e.count + '</span>' +
    (img ? '<img class="dimg" src="' + img + '" alt="" loading="lazy">' : mascot(84, e.color)) + '<span class="dn">' + esc(e.name) + '</span>' +
    '<span class="dwho">' + who.slice(0, 4).map(m => avatar(m)).join('') + '</span></button>';
}
function viewDex(){
  const arr = calcDex();
  let h = '<div class="sec"><h2>초밥 도감</h2></div><p class="hint" style="margin:0">후기의 "오늘의 한 점"이 자동으로 모여요.</p>';
  if (!arr.length) return h + emptyBox('아직 도감이 비어 있어요.<br>후기에 "오늘의 한 점"을 적으면 여기에 모여요.');
  h += '<div class="dexsum">' + mascot(52, '#FF8A6B') + '<p>지금까지 <b>' + arr.length + '종</b>의 초밥을<br>최고의 한 점으로 꼽았어요!</p></div>';
  const top = arr.slice(0, 3);
  const order = top.length === 3 ? [1, 0, 2] : top.length === 2 ? [1, 0] : [0];
  h += '<div class="sec" style="margin-top:24px"><h2>우리 모임 최애 TOP ' + top.length + '</h2></div><div class="podium">' +
    order.map(i => { const e = top[i]; const pim = safeImg(S.dexImgs[e.key]) ? S.dexImgs[e.key] : ''; return '<button class="pod p' + (i + 1) + '" data-act="openDex" data-key="' + esc(e.key) + '"><span class="pod-r">' + (i + 1) + '위</span>' + (pim ? '<img class="pimg" src="' + pim + '" alt="">' : mascot(i === 0 ? 88 : 70, e.color)) + '<span class="pod-n">' + esc(e.name) + '</span><span class="pod-c">' + e.count + '번 꼽혔어요</span></button>'; }).join('') + '</div>';
  h += '<div class="sec" style="margin-top:24px"><h2>전체 도감</h2></div><div class="dgrid">' + arr.map(dexCard).join('') + '</div>';
  const favs = memberList().map(mem => {
    let best = null;
    arr.forEach(e => {
      const mine = e.picks.filter(p => p.mem.id === mem.id);
      if (!mine.length) return;
      const last = mine.map(p => p.date).sort().pop();
      if (!best || mine.length > best.n || (mine.length === best.n && last > best.last)) best = { e: e, n: mine.length, last: last };
    });
    return best ? '<div class="fav">' + avatar(mem, 'lg') + '<span class="fav-n">' + esc(mem.name) + '</span><span class="fav-v"><b>' + esc(best.e.name) + '</b> ' + best.n + '번</span></div>' : '';
  }).join('');
  if (favs) h += '<div class="sec" style="margin-top:24px"><h2>멤버별 최애</h2></div><div class="favs">' + favs + '</div>';
  return h;
}

  if (a === 'addPlace') { openPlaceSheet(null); return; }
  if (a === 'openPlace') { openMapItem(t.dataset.kind, t.dataset.id); return; }
  if (a === 'editPlace') { openPlaceSheet(t.dataset.id); return; }
  if (a === 'planMeeting') {
    const w = S.wishes.find(x => x.id === t.dataset.id);
    if (w) openMeetingSheet(null, { name: w.name, address: w.address, lat: w.lat, lng: w.lng, placeUrl: w.placeUrl, link: w.link, memo: w.memo, wish: w });
    return;
  }
  if (a === 'zoom') {
    const list = (S.photos[t.dataset.mid] || {})[t.dataset.member] || [];
    const src = list[Number(t.dataset.i)];
    if (src && safeImg(src)) openLightbox(src, { mid: t.dataset.mid, member: t.dataset.member, i: t.dataset.i });
    return;
  }
  if (a === 'zoomCover') {
    const cm = S.meetings.find(x => x.id === t.dataset.mid);
    if (cm && safeImg(cm.cover)) openLightbox(cm.cover);
    return;
  }
  if (a === 'setCover') {
    const sm = S.meetings.find(x => x.id === t.dataset.mid);
    const ssrc = ((S.photos[t.dataset.mid] || {})[t.dataset.member] || [])[Number(t.dataset.i)];
    if (sm && ssrc) {
      toast('대표 사진으로 지정하는 중…');
      coverFromData(ssrc).then(u => Store.saveMeeting(Object.assign({}, sm, { cover: u, updatedAt: Date.now() })))
        .then(() => { closeLightbox(); toast('대표 사진으로 지정했어요'); })
        .catch(e => { console.error(e); toast('지정하지 못했어요'); });
    }
    return;
  }
  if (a === 'sheetClose') {
    if (t.classList.contains('backdrop') && e.target !== t) return;
    closeSheet(); return;
  }
  if (a === 'tab') { S.tab = t.dataset.tab; S.detail = null; S.store = null; S.memberView = null; render(false); }
  else if (a === 'openMember') { S.memberView = t.dataset.id; render(false); }
  else if (a === 'memberBack') { S.memberView = null; render(false); }
  else if (a === 'openStore') { S.store = t.dataset.key; render(false); }
  else if (a === 'storeBack') { S.store = null; render(false); }
  else if (a === 'open') { S.detail = t.dataset.id; render(false); }
  else if (a === 'back') { S.detail = null; render(false); }
  else if (a === 'addMeeting') openMeetingSheet(null);
  else if (a === 'editMeeting') openMeetingSheet(t.dataset.id);
  else if (a === 'review') openReviewSheet(t.dataset.id, t.dataset.member || null);
  else if (a === 'setName') openNameSheet(S.meId, null);
  else if (a === 'rename') openNameSheet(t.dataset.id, null);
  else if (a === 'addMember') openNameSheet(null, null);
});

/* ---------- boot ---------- */
(async function boot(){
  render(false);
  let ok = false;
  try { ok = await initCloud(); } catch (e) { console.error(e); ok = false; }
  if (!ok) initLocal();
})();

})();
</script>
</body>
</html>
